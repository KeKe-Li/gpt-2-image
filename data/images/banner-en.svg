<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1024" viewBox="0 0 1664 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a88f"/>
      <stop offset="42%" stop-color="#064d71"/>
      <stop offset="100%" stop-color="#073b61"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063f59" stop-opacity=".94"/>
      <stop offset="100%" stop-color="#063c63" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55e4d0"/>
      <stop offset="100%" stop-color="#55b8ff"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d9"/>
      <stop offset="100%" stop-color="#e9e7a5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7595aa" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#31566f" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#b8e7f0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001b35" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="caseClip"><rect x="909" y="215" width="355" height="270" rx="18"/></clipPath>
    <clipPath id="outClip"><rect x="1113" y="453" width="281" height="163" rx="13"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1664" height="1024" fill="url(#bg)"/>
  <rect width="1664" height="1024" fill="url(#grid)"/>

  <!-- Decorative sweeping curves -->
  <path d="M1118 -32 C1290 136 1460 219 1668 176" fill="none" stroke="#66f1db" stroke-width="4" opacity=".8"/>
  <path d="M1110 -15 C1300 155 1460 237 1674 193" fill="none" stroke="#a4d9e7" stroke-width="3" opacity=".55"/>
  <path d="M-30 674 C174 743 280 853 412 1055" fill="none" stroke="#68e5d3" stroke-width="4" opacity=".65"/>
  <path d="M-40 693 C164 763 273 864 389 1050" fill="none" stroke="#9bb9d2" stroke-width="3" opacity=".45"/>

  <!-- Main glass panel -->
  <rect x="57" y="61" width="1550" height="805" rx="42" fill="url(#panel)" stroke="#8bc9d5" stroke-opacity=".5" stroke-width="2"/>
  <rect x="74" y="77" width="1516" height="773" rx="32" fill="none" stroke="#b9e4eb" stroke-opacity=".08"/>

  <!-- Prompt as code badge -->
  <g transform="translate(124 108)">
    <path d="M45 2 C55 13 62 14 76 11 C79 26 87 32 101 36 C94 49 95 58 103 69 C91 76 87 84 88 99 C73 97 65 102 56 114 C46 103 37 100 23 103 C23 89 18 81 6 74 C14 62 14 53 8 40 C22 35 28 28 30 13 C36 14 41 11 45 2Z" fill="#9de6d8" opacity=".9"/>
    <circle cx="55" cy="58" r="44" fill="#164d68" stroke="#d3fbf0" stroke-width="3" opacity=".95"/>
    <circle cx="55" cy="58" r="36" fill="none" stroke="#72d4dd" stroke-width="2"/>
    <text x="55" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">PROMPT</text>
    <text x="55" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">AS</text>
    <text x="55" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">CODE</text>
    <path d="M24 98 L13 137 L35 127 L47 148 L58 111Z" fill="#66cfc4" stroke="#163f5d" stroke-width="2"/>
    <path d="M73 103 L96 139 L97 119 L119 127 L90 93Z" fill="#66cfc4" stroke="#163f5d" stroke-width="2"/>
  </g>

  <!-- Left typography -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="126" y="369" font-size="89" font-weight="800" fill="#ffffff" letter-spacing="-3">GPT Image 2.5</text>
    <text x="126" y="447" font-size="50" font-weight="800" fill="#79f0d4" letter-spacing="-1.5">Industrial-Grade Prompt</text>
    <text x="126" y="503" font-size="50" font-weight="800" fill="#79f0d4" letter-spacing="-1.5">Engine &amp; Template Library</text>

    <text x="126" y="558" font-size="27" font-weight="400" fill="#f4f8fa">Turn community examples into reusable</text>
    <text x="126" y="592" font-size="27" font-weight="400" fill="#f4f8fa">protocols, taking image generation from</text>
    <text x="126" y="626" font-size="27" font-weight="400" fill="#f4f8fa">inspiration to systems engineering.</text>
  </g>

  <!-- Bottom metric cards -->
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="127" y="680" width="198" height="126" rx="12" fill="#edf4f2"/>
    <text x="149" y="745" font-size="51" font-weight="800" fill="#16425d">370+</text>
    <text x="150" y="778" font-size="20" font-weight="800" fill="#16425d">CASES</text>

    <rect x="348" y="680" width="199" height="126" rx="12" fill="#0b5575" fill-opacity=".92"/>
    <text x="371" y="745" font-size="51" font-weight="800" fill="#ffffff">20+</text>
    <text x="372" y="778" font-size="20" font-weight="800" fill="#ffffff">TEMPLATES</text>

    <rect x="570" y="680" width="198" height="126" rx="12" fill="#0b4c71" fill-opacity=".94"/>
    <text x="589" y="748" font-size="20" font-weight="800" fill="#ffffff">SCHEMA-DRIVEN</text>
  </g>

  <!-- Case gallery card -->
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="909" y="215" width="355" height="270" rx="18" fill="url(#glass)" stroke="#8ab8ca" stroke-width="2" stroke-opacity=".55"/>
    <text x="938" y="270" font-size="28" font-weight="800" fill="#ffffff">Case Gallery</text>
    <g clip-path="url(#caseClip)">
      <rect x="938" y="296" width="298" height="191" fill="#bfe8d5"/>
      <circle cx="1030" cy="367" r="48" fill="#ffd35b"/>
      <path d="M925 432 L982 388 L1020 407 L1090 337 L1143 392 L1195 350 L1260 411 L1260 505 L925 505Z" fill="#216d86"/>
      <path d="M925 458 L995 421 L1042 443 L1107 386 L1160 421 L1202 393 L1260 438 L1260 505 L925 505Z" fill="#14516e"/>
      <path d="M925 483 L1010 454 L1060 469 L1120 435 L1170 465 L1210 441 L1260 462 L1260 505 L925 505Z" fill="#0b3e59"/>
    </g>
  </g>

  <!-- Output card -->
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="1113" y="367" width="281" height="297" rx="18" fill="url(#output)" stroke="#f2eebc" stroke-width="2"/>
    <text x="1143" y="427" font-size="28" font-weight="800" fill="#14364c">OUTPUT</text>
    <g clip-path="url(#outClip)">
      <rect x="1143" y="453" width="281" height="163" fill="#617e8e"/>
      <circle cx="1260" cy="525" r="44" fill="#bde8d0"/>
      <path d="M1110 599 L1170 553 L1222 578 L1284 511 L1337 556 L1390 527 L1445 567 L1445 640 L1110 640Z" fill="#173d58"/>
      <path d="M1110 620 L1180 587 L1230 604 L1287 562 L1339 595 L1388 574 L1445 600 L1445 640 L1110 640Z" fill="#0b2e48"/>
    </g>
  </g>

  <!-- Prompt tag -->
  <g filter="url(#shadow)">
    <rect x="1327" y="426" width="185" height="108" rx="17" fill="#0b4b6b" stroke="#6fe5d5" stroke-width="2"/>
    <text x="1420" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#ffffff">{ prompt }</text>
  </g>

  <!-- Connector network -->
  <g fill="none" stroke="url(#cyan)" stroke-width="4">
    <path d="M1264 283 H1351 V367"/>
    <path d="M1010 486 V548 H1103"/>
    <path d="M1396 534 V712"/>
    <path d="M1416 534 V712"/>
    <path d="M1437 534 V712"/>
    <path d="M1458 534 V712"/>
  </g>
  <g fill="#f5e9aa" stroke="#b9d9da" stroke-width="4">
    <circle cx="1351" cy="283" r="16"/>
    <circle cx="1010" cy="548" r="16"/>
  </g>

  <!-- Bottom-right pipeline label -->
  <text x="936" y="779" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#ffffff">
    cases.reverse_engineered → reusable_assets
  </text>

  <!-- GPT 2.5 badge -->
  <g transform="translate(1498 742)">
    <path d="M38 2 C47 12 55 14 67 11 C70 24 78 31 90 34 C84 46 85 55 92 65 C81 71 76 80 78 92 C64 90 56 96 48 106 C39 97 31 94 19 97 C20 85 14 77 4 71 C11 61 11 51 6 41 C18 37 25 29 27 16 C32 16 35 10 38 2Z" fill="#b0ddd5" opacity=".9"/>
    <circle cx="47" cy="56" r="38" fill="#164d68" stroke="#d4f3e9" stroke-width="2"/>
    <text x="47" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#ffffff">GPT</text>
    <text x="47" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#ffffff">2.5</text>
  </g>
</svg>